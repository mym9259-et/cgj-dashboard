services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cgj_dashboard
      POSTGRES_USER: cgj
      POSTGRES_PASSWORD: cgj123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgj -d cgj_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://cgj:cgj123@db:5432/cgj_dashboard
      UPLOAD_DIR: /app/uploads
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      STANDARD_INITIAL_PASSWORD: ${STANDARD_INITIAL_PASSWORD}
      SECURE_COOKIES: "true"
      CORS_ORIGINS: https://hz-future.net
      ENABLE_DOCS: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
